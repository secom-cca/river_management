# Copy this file to config/basins/<basin-key>.yaml and replace every TODO.
key: new_basin
name: TODO 河川流域

calendar: {start_year: 2009, num_years: 15, use_leap_years: true}

inputs:
  weather_up: data/TODO_weather_up.xlsx
  weather_down: data/TODO_weather_down.xlsx
  flow_up: data/TODO_flow_up.csv
  flow_down: data/TODO_flow_down.csv

climate_scenarios:
  present: {precip_ratio: 1.0, temperature_shift: 0.0}
  2C: {precip_ratio: 1.1, temperature_shift: 1.3}
  4C: {precip_ratio: 1.3, temperature_shift: 4.1}

# Start with measured regional values. Hydrological ratios should then be
# replaced by calibrate_hydrology.py results.
model_parameters:
  initial_dam_capacity: 0
  initial_drainage_capacity: 0
  current_highwater_discharge: 0
  future_highwater_discharge: 0
  upstream_area: 0
  downstream_area: 0
  landslide_design_daily_precipitation: 0
  initial_total_risk_households: 0
  risk_household_overlap_ratio: 0
  minimum_river_discharge: 0
  river_water_level_base: 0
  river_water_level_discharge_coefficient: 0
  forest_area_ratio: 0
  paddy_field_ratio: 0
  ratio_of_paddy_field_in_risky_area: 0
  innundation_risky_area_ratio: 0
  flood_risky_area_ratio: 0
  recovery_ratio: 0.9
  crop_price: 0
  waterholding_capacity_of_forest_base: 225
  innundation_damage_per_resident: 0
  flood_damage_per_resident: 0
  gdp_per_resident: 0
  paddy_field_capacity_per_area: 500
  paddy_dam_capacity_per_area: 1500
  unmanaged_plantation_forest_coef: 0.7
  upstream_outflow_ratio: 0.5
  downstream_outflow_ratio: 0.5
  direct_discharge_ratio: 0.5
  upstream_percolation_ratio: 0.2
  downstream_deep_percolation_ratio: 0.2
  upstream_middle_flow_ratio: 0.5
  downstream_percolation_ratio: 0.2
  downstream_middle_flow_ratio: 0.5
  upstream_deep_percolation_ratio: 0.5

sensitivity_bounds:
  forest_area_ratio: [0, 1, 0]
  paddy_field_ratio: [0, 1, 0]
  ratio_of_paddy_field_in_risky_area: [0, 1, 0]
  innundation_risky_area_ratio: [0, 1, 0]
  flood_risky_area_ratio: [0, 1, 0]
  recovery_ratio: [0.5, 1, 0.9]
  crop_price: [0, 1, 0]
  waterholding_capacity_of_forest_base: [150, 300, 225]
  innundation_damage_per_resident: [0, 1, 0]
  flood_damage_per_resident: [0, 1, 0]
  gdp_per_resident: [0, 1, 0]
  paddy_field_capacity_per_area: [400, 600, 500]
  paddy_dam_capacity_per_area: [1000, 2000, 1500]
  unmanaged_plantation_forest_coef: [0.5, 0.9, 0.7]

hydrology_calibration:
  calibration_fraction: 0.7
  objective_weights: {upstream_nse: 1.0, downstream_nse: 1.0}
  bounds:
    upstream_outflow_ratio: [0.01, 0.99]
    downstream_outflow_ratio: [0.01, 0.99]
    direct_discharge_ratio: [0.01, 0.99]
    upstream_percolation_ratio: [0.01, 0.5]
    downstream_deep_percolation_ratio: [0.01, 0.5]
    upstream_middle_flow_ratio: [0.01, 0.99]
    downstream_percolation_ratio: [0.01, 0.5]
    downstream_middle_flow_ratio: [0.01, 0.99]
    upstream_deep_percolation_ratio: [0.01, 0.99]
