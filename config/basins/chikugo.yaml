key: chikugo
name: 筑後川流域

calendar:
  start_year: 2009
  num_years: 15
  use_leap_years: true

# Input files must use the same sheet/column layout as the current model.
inputs:
  weather_up: data/jma_hita_2009_2023.xlsx
  weather_down: data/jma_asakura_2009_2023.xlsx
  flow_up: data/flow_arase_2009_2023_x100000_0to364_utf8.csv
  flow_down: data/flow_senoshita_2009_2023_x100000_0to364_utf8.csv

climate_scenarios:
  present: {precip_ratio: 1.0, temperature_shift: 0.0}
  2C: {precip_ratio: 1.1, temperature_shift: 1.3}
  4C: {precip_ratio: 1.3, temperature_shift: 4.1}

# Shared by parameter study, policy optimisation, and calibration.
model_parameters:
  initial_dam_capacity: 74200000
  initial_drainage_capacity: 50
  current_highwater_discharge: 5200
  future_highwater_discharge: 7200
  upstream_area: 157585
  downstream_area: 143951
  landslide_design_daily_precipitation: 322
  initial_total_risk_households: 50000
  risk_household_overlap_ratio: 0.5
  minimum_river_discharge: 2500000
  river_water_level_base: 10
  river_water_level_discharge_coefficient: 0.001
  forest_area_ratio: 0.92
  paddy_field_ratio: 0.15
  ratio_of_paddy_field_in_risky_area: 0.10
  innundation_risky_area_ratio: 0.8
  flood_risky_area_ratio: 0.8
  recovery_ratio: 0.9
  crop_price: 250
  waterholding_capacity_of_forest_base: 225
  innundation_damage_per_resident: 27397.2602739726
  flood_damage_per_resident: 27397.2602739726
  gdp_per_resident: 8219.17808219178
  paddy_field_capacity_per_area: 500
  paddy_dam_capacity_per_area: 1500
  unmanaged_plantation_forest_coef: 0.7
  upstream_outflow_ratio: 0.272198
  downstream_outflow_ratio: 0.240634
  direct_discharge_ratio: 0.815126
  upstream_percolation_ratio: 0.5
  downstream_deep_percolation_ratio: 0.0263544
  upstream_middle_flow_ratio: 0.443267
  downstream_percolation_ratio: 0.5
  downstream_middle_flow_ratio: 0.0326612
  upstream_deep_percolation_ratio: 0.540584

sensitivity_bounds:
  forest_area_ratio: [0.85, 0.95, 0.92]
  paddy_field_ratio: [0.10, 0.20, 0.15]
  ratio_of_paddy_field_in_risky_area: [0.05, 0.15, 0.10]
  innundation_risky_area_ratio: [0.5, 0.8, 0.8]
  flood_risky_area_ratio: [0.5, 0.8, 0.8]
  recovery_ratio: [0.5, 1.0, 0.9]
  crop_price: [200, 400, 250]
  waterholding_capacity_of_forest_base: [200, 250, 225]
  innundation_damage_per_resident: [13698.6301369863, 41095.8904109589, 27397.2602739726]
  flood_damage_per_resident: [13698.6301369863, 41095.8904109589, 27397.2602739726]
  gdp_per_resident: [6849.31506849315, 9589.04109589041, 8219.17808219178]
  paddy_field_capacity_per_area: [400, 600, 500]
  paddy_dam_capacity_per_area: [1000, 2000, 1500]
  unmanaged_plantation_forest_coef: [0.5, 0.9, 0.7]

hydrology_calibration:
  calibration_fraction: 0.7
  objective_weights: {upstream_nse: 1.0, downstream_nse: 1.0}
  bounds:
    upstream_outflow_ratio: [0.01, 0.99]
    downstream_outflow_ratio: [0.01, 0.99]
    direct_discharge_ratio: [0.01, 0.99]
    upstream_percolation_ratio: [0.01, 0.5]
    downstream_deep_percolation_ratio: [0.01, 0.5]
    upstream_middle_flow_ratio: [0.01, 0.99]
    downstream_percolation_ratio: [0.01, 0.5]
    downstream_middle_flow_ratio: [0.01, 0.99]
    upstream_deep_percolation_ratio: [0.01, 0.99]
